<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jason's tweet claim, tracked in the open: QQQ + top AI vs BTC, and his Bitcoin record-high calls.">
<title>Jason's claim — tracked in the open</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#0e141e; --panel2:#131b27; --ink:#f3f4f6;
    --muted:#9ca3af; --dim:#8b95a5; --line:#243044; --track:#1f2937;
    --green:#34d399; --red:#f87171; --amber:#fbbf24; --blue:#60a5fa;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px; margin:0 auto; padding:20px 16px 48px}
  a{color:var(--blue); text-decoration:none}
  a:hover{text-decoration:underline}

  header{padding:8px 0 20px; border-bottom:1px solid var(--line)}
  h1{font-size:1.35rem; margin:0 0 4px; letter-spacing:-.01em}
  .sub{color:var(--muted); font-size:.95rem}
  .daychip{
    display:inline-block; background:var(--panel2); border:1px solid var(--line);
    color:var(--ink); font-size:.85rem; font-weight:600; padding:3px 10px; border-radius:999px;
    margin-top:8px;
  }
  .claim{
    margin-top:12px; padding:12px 14px; background:var(--panel); border-left:3px solid var(--blue);
    border-radius:8px; font-size:.92rem; color:var(--ink);
  }
  .claim em{color:var(--blue); font-style:normal}
  .claim .src{display:block; margin-top:6px; color:var(--dim); font-size:.82rem}

  section{margin-top:24px}
  h2{font-size:1.02rem; margin:0 0 12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em}

  .verdict{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:12px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--line);
  }
  .dot{width:10px; height:10px; border-radius:50%; flex:none}
  .dot.loss{background:var(--red)} .dot.win{background:var(--green)} .dot.split{background:var(--amber)}
  .dot.open{background:var(--dim)}
  .verdict .t{font-weight:600}

  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
  .card .name{color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.05em}
  .card .price{font-size:1.5rem; font-weight:700; margin:6px 0 2px; font-variant-numeric:tabular-nums}
  .card .ret{font-size:1.05rem; font-weight:600; font-variant-numeric:tabular-nums}
  .card .gap{color:var(--dim); font-size:.82rem; margin-top:4px}
  .up{color:var(--green)} .down{color:var(--red)}
  .basket{color:var(--dim); font-size:.8rem; margin-top:8px; line-height:1.6}

  .chartbox{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 8px 8px}
  .legend{display:flex; gap:16px; flex-wrap:wrap; padding:0 8px 6px; font-size:.82rem; color:var(--muted)}
  .legend span{display:inline-flex; align-items:center; gap:6px}
  .swatch{width:12px; height:3px; border-radius:2px; display:inline-block}
  svg{display:block; width:100%; height:auto}

  table{width:100%; border-collapse:collapse; font-size:.9rem}
  th,td{text-align:left; padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:top}
  th{color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.04em}
  .pill{display:inline-block; font-size:.76rem; font-weight:600; padding:2px 9px; border-radius:999px}
  .pill.open{background:#1f2937; color:var(--ink)}
  .pill.won{background:rgba(52,211,153,.15); color:var(--green)}
  .pill.lost{background:rgba(248,113,113,.15); color:var(--red)}
  .bet-note{color:var(--dim); font-size:.84rem; margin-top:2px}

  .bars{display:grid; gap:14px}
  .bar{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
  .bar .top{display:flex; justify-content:space-between; gap:8px; margin-bottom:8px}
  .bar .label{font-weight:600}
  .bar .val{color:var(--muted); font-variant-numeric:tabular-nums}
  .track{height:10px; background:var(--track); border-radius:6px; overflow:hidden}
  .fill{height:100%; border-radius:6px}
  .bar .sub{font-size:.82rem; color:var(--dim); margin-top:8px}

  .note{color:var(--dim); font-size:.86rem; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
  .note b{color:var(--ink)}

  footer{margin-top:32px; padding-top:16px; border-top:1px solid var(--line); color:var(--dim); font-size:.78rem}
  footer a{color:var(--muted)}

  @media (max-width:600px){
    h1{font-size:1.2rem}
    .card .price{font-size:1.3rem}
    table{font-size:.82rem}
    th,td{padding:8px 6px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Jason's tweet claim — tracked in the open</h1>
    <div class="sub" id="subline">Loading…</div>
    <div class="daychip" id="daychip" style="display:none"></div>
    <div class="claim" id="claim" style="display:none"></div>
  </header>

  <main id="main" style="display:none">
    <section>
      <h2>Where it stands</h2>
      <div class="verdict" id="verdict"></div>
      <div class="cards" id="cards" style="margin-top:12px"></div>
    </section>

    <section>
      <h2>Since the tweet</h2>
      <div class="chartbox">
        <div class="legend" id="legend"></div>
        <svg id="chart" viewBox="0 0 600 240" preserveAspectRatio="none" role="img" aria-label="Return since the tweet"></svg>
      </div>
    </section>

    <section>
      <h2>The six bets</h2>
      <table>
        <thead><tr><th>Bet</th><th>Resolves</th><th>Status</th><th>Where it stands</th></tr></thead>
        <tbody id="bets"></tbody>
      </table>
      <p class="note" id="bets-note" style="margin-top:10px"></p>
    </section>

    <section>
      <h2>Bitcoin vs his levels</h2>
      <div class="bars" id="levels"></div>
    </section>

    <section id="cpi-sec" style="display:none">
      <h2>Real terms</h2>
      <div class="note" id="cpi"></div>
    </section>

    <section>
      <div class="note" id="notes" style="display:none"></div>
    </section>
  </main>

  <footer id="footer"></footer>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  function fmtMoney(v, dp){ if(v==null) return "—"; return "$"+Number(v).toLocaleString('en-US',{minimumFractionDigits:dp||0,maximumFractionDigits:dp||0}); }
  function fmtPct(v){ if(v==null) return "—"; return (v>0?"+":"")+Number(v).toFixed(2)+"%"; }
  function fmtSigned(v){ if(v==null) return "—"; return (v>0?"+":"")+Number(v).toFixed(1)+"%"; }
  function cls(v){ return v==null ? "" : (v>=0 ? "up" : "down"); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function render(d){
    var m = d.meta;
    document.title = m.title;
    $("title").textContent = m.title;
    $("subline").textContent = "Claim posted "+m.claim_posted+" · updated "+m.as_of+" · "+m.total_days+"-day window";
    var chip = $("daychip");
    chip.style.display = "inline-block";
    chip.textContent = "Day "+m.day_of+" of "+m.total_days;

    var claim = $("claim");
    claim.style.display = "block";
    claim.innerHTML =
      '<em>“90% chance that $QQQ and top AI companies will beat $BTC over the next 12, 24 and 36 months”</em>'+
      ' and <em>“Bitcoin won’t break its record high in next 12 months.”</em>'+
      '<span class="src"><a href="'+esc(m.tweet_url)+'" target="_blank" rel="noopener">original tweet</a> · '+
      'second tweet: <a href="'+esc(m.tweet2_url)+'" target="_blank" rel="noopener">“test $57k again / never break ATH”</a> · '+
      'track record: <a href="'+esc(m.ref_url)+'" target="_blank" rel="noopener">“11 years, still waiting for zero”</a></span>';

    // verdict
    var s = d.standing;
    var vmap = {
      "both ahead of BTC":  ["win","Jason is currently ahead — QQQ and AI both above BTC."],
      "both behind BTC":    ["loss","Jason is currently losing — QQQ and AI both below BTC."],
      "split":              ["split","Split — one leg ahead of BTC, one behind."],
      "no close data yet":  ["open","No close data yet."]
    };
    var v = vmap[s] || ["open", s];
    $("verdict").innerHTML = '<span class="dot '+v[0]+'"></span><span class="t">'+esc(v[1])+"</span>"+
      '<span style="color:var(--dim);font-size:.84rem">(only counts at the 12/24/36-month marks)</span>';

    // scoreboard cards
    var sb = d.scoreboard;
    function card(name, price, ret, gap, extra){
      return '<div class="card">'+
        '<div class="name">'+esc(name)+'</div>'+
        '<div class="price">'+(price!=null?fmtMoney(price, price>=1000?0:2):"—")+'</div>'+
        '<div class="ret '+cls(ret)+'">'+fmtPct(ret)+' <span style="font-weight:400;color:var(--dim);font-size:.8rem">since '+m.claim_posted+'</span></div>'+
        (gap!=null?'<div class="gap">'+fmtSigned(gap)+' vs BTC</div>':'')+
        (extra?extra:'')+
      '</div>';
    }
    var parts = sb.ai.parts || {};
    var basketList = sb.ai.basket.join(" · ");
    var basketDetail = "";
    if(sb.ai.basket.length){
      var rows = sb.ai.basket.map(function(t){ return t+" "+fmtPct(parts[t]); });
      basketDetail = '<div class="basket">'+esc(rows.join(" · "))+'</div>';
    }
    $("cards").innerHTML =
      card("BTC", sb.btc.price, sb.btc.ret_pct, null) +
      card("QQQ", sb.qqq.price, sb.qqq.ret_pct, sb.qqq.behind_btc_pct) +
      card("Top AI (equal-weight "+sb.ai.basket.length+")", null, sb.ai.ret_pct, sb.ai.behind_btc_pct,
           '<div class="basket">'+esc(basketList)+'</div>'+basketDetail) +
      card("MAGS (cross-check)", sb.mags.price, sb.mags.ret_pct, sb.mags.behind_btc_pct);

    // chart
    drawChart(d.chart);

    // bets
    var bets = d.bets.rows || [];
    var tb = $("bets");
    tb.innerHTML = bets.map(function(b){
      return '<tr><td>'+esc(b.name)+'</td><td>'+esc(b.resolves)+'</td>'+
        '<td><span class="pill '+esc(b.status)+'">'+esc(b.status)+'</span></td>'+
        '<td><span class="bet-note">'+esc(b.note)+'</span></td></tr>';
    }).join("");
    $("bets-note").textContent = d.bets.headline + ". Each 12/24/36-month bet needs BOTH QQQ and the AI basket above BTC at that mark.";

    // levels
    var rh = d.record_high, tk = d.test_57k;
    function bar(label, cur, level, pctLabel, sub, color){
      var pct = cur!=null && level ? Math.min(100, Math.max(0, Math.abs(cur/level)*100)) : 0;
      return '<div class="bar">'+
        '<div class="top"><span class="label">'+esc(label)+'</span><span class="val">'+esc(pctLabel)+'</span></div>'+
        '<div class="track"><div class="fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
        '<div class="sub">'+sub+'</div>'+
      '</div>';
    }
    $("levels").innerHTML =
      bar("Record high to break", rh.btc, rh.ath,
          fmtMoney(rh.btc,0)+" vs "+fmtMoney(rh.ath,0),
          rh.below_pct+"% below the record · "+rh.days_left+" days left"+
            (rh.peak_since && rh.peak_since.high ? " · highest since his tweet: "+fmtMoney(rh.peak_since.high,0)+" ("+esc(rh.peak_since.date)+")" : ""),
          "var(--red)") +
      bar("Test the $57k low", tk.btc, tk.threshold,
          fmtMoney(tk.btc,0)+" vs "+fmtMoney(tk.threshold,0),
          tk.above_pct+"% above $57,000 · "+tk.days_left+" days left",
          "var(--green)");

    // CPI
    if(d.cpi){
      $("cpi-sec").style.display = "block";
      $("cpi").innerHTML = "US CPI is running <b>"+fmtPct(d.cpi.yoy_pct)+"/yr</b> "+
        "(+<b>"+fmtPct(d.cpi.cum_pct)+"</b> cumulative since the claim). A flat nominal return is a real decline by that much. "+
        "Source: "+esc(d.cpi.source||"")+" · "+esc(d.cpi.latest_month||"");
    }

    // notes
    var notes = d.notes || [];
    if(notes.length){
      $("notes").style.display = "block";
      $("notes").innerHTML = "<b>Data notes:</b> "+esc(notes.join(" · "));
    }

    // footer
    $("footer").innerHTML =
      "Baselines frozen at the "+esc(m.claim_posted)+" close: QQQ "+fmtMoney(m.baselines.QQQ,2)+
      ", BTC "+fmtMoney(m.baselines.BTC,0)+" · record high "+fmtMoney(m.baselines.record_high,0)+
      " (set "+esc(m.baselines.ath_date)+").<br>"+
      esc(d.disclaimer)+" · Updated "+esc(m.generated_at)+" UTC · <a href=\""+esc(m.tweet_url)+"\" target=\"_blank\" rel=\"noopener\">source</a>";

    $("main").style.display = "block";
  }

  function drawChart(c){
    var svg = $("chart");
    var W = 600, H = 240, padL = 34, padR = 10, padT = 12, padB = 22;
    var dates = c.dates || [];
    var series = {BTC:c.btc, QQQ:c.qqq, AI:c.ai};
    var colors = {BTC:"#fbbf24", QQQ:"#60a5fa", AI:"#34d399"};
    $("legend").innerHTML = Object.keys(series).map(function(k){
      return '<span><span class="swatch" style="background:'+colors[k]+'"></span>'+k+'</span>';
    }).join("");

    if(!dates.length){ svg.innerHTML = ""; return; }
    var all = [];
    Object.keys(series).forEach(function(k){ (series[k]||[]).forEach(function(v){ if(v!=null) all.push(v); }); });
    if(!all.length){ svg.innerHTML = ""; return; }
    var lo = Math.min(0, Math.min.apply(null, all));
    var hi = Math.max(0, Math.max.apply(null, all));
    if(hi-lo < 1){ hi = lo+1; }
    var x = function(i){ return padL + (dates.length<=1 ? 0 : i/(dates.length-1)*(W-padL-padR)); };
    var y = function(v){ return padT + (1-(v-lo)/(hi-lo))*(H-padT-padB); };

    var parts = [];
    // grid + zero line + y labels
    var zeroY = y(0);
    parts.push('<line x1="'+padL+'" y1="'+zeroY+'" x2="'+(W-padR)+'" y2="'+zeroY+'" stroke="#3b4757" stroke-width="1"/>');
    [lo, 0, hi].forEach(function(v){
      if(v==null) return;
      var yy = y(v);
      parts.push('<text x="'+(padL-6)+'" y="'+(yy+3)+'" text-anchor="end" font-size="10" fill="#8b95a5">'+ (v>=0?"+":"") + v.toFixed(1)+'%</text>');
    });
    // lines
    Object.keys(series).forEach(function(k){
      var pts = [];
      var darr = series[k] || [];
      darr.forEach(function(v,i){ if(v!=null) pts.push(x(i)+","+y(v)); });
      if(pts.length < 2){ return; }
      parts.push('<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+colors[k]+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');
    });
    // last-point dots
    Object.keys(series).forEach(function(k){
      var darr = series[k] || [];
      var last = null, li = -1;
      for(var i=darr.length-1;i>=0;i--){ if(darr[i]!=null){ last=darr[i]; li=i; break; } }
      if(last!=null){ parts.push('<circle cx="'+x(li)+'" cy="'+y(last)+'" r="3" fill="'+colors[k]+'"/>'); }
    });
    // x labels (first / last date)
    if(dates.length){
      parts.push('<text x="'+padL+'" y="'+(H-6)+'" text-anchor="start" font-size="10" fill="#8b95a5">'+esc(dates[0])+'</text>');
      parts.push('<text x="'+(W-padR)+'" y="'+(H-6)+'" text-anchor="end" font-size="10" fill="#8b95a5">'+esc(dates[dates.length-1])+'</text>');
    }
    svg.innerHTML = parts.join("");
  }

  fetch('data.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(render)
    .catch(function(e){
      $("subline").textContent = "Could not load tracker data ("+esc(e.message)+").";
    });
})();
</script>
</body>
</html>
