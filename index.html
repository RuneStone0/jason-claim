<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jason's bearish Bitcoin call, scored live against the market. Six bets, tracked in the open.">
<title>Jason vs Bitcoin — live scoreboard</title>

<style>
  :root{
    --bg:#070b12; --panel:#0d1420; --panel2:#111a29; --ink:#f5f7fa; --muted:#a3aec2;
    --dim:#7c8799; --line:#1d2a3d; --track:#16202f;
    --green:#2ee6a8; --red:#ff6b6b; --amber:#ffc44d; --blue:#5ea8ff;
    --btc:#f7931a;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(1200px 500px at 50% -200px, rgba(247,147,26,.10), transparent 60%),
                     radial-gradient(900px 420px at 85% 110%, rgba(46,230,168,.06), transparent 60%);
  }
  a{color:var(--blue); text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:820px; margin:0 auto; padding:0 16px 56px}

  /* ---- header ---- */
  header{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 0 14px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.05rem; letter-spacing:-.02em}
  .brand .mark{width:28px; height:28px; flex:none}
  .daychip{background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    font-size:.78rem; font-weight:700; padding:4px 12px; border-radius:999px; white-space:nowrap}

  /* ---- hero matchup ---- */
  .hero{
    border:1px solid var(--line); border-radius:18px; overflow:hidden;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    box-shadow:0 10px 40px -18px rgba(0,0,0,.8);
  }
  .vs{display:grid; grid-template-columns:1fr 64px 1fr; align-items:center; padding:24px 18px 8px}
  .side{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center}
  .facewrap{position:relative}
  .face{width:72px; height:72px; display:grid; place-items:center; font-size:44px; border-radius:50%;
    border:2px solid var(--line); background:var(--bg)}
  .face svg{width:54px; height:54px}
  .face.lead-btc{background:rgba(46,230,168,.24); border-color:rgba(46,230,168,.28)}
  .face.lead-jason{background:rgba(255,107,107,.24); border-color:rgba(255,107,107,.28)}
  .crown{position:absolute; top:-14px; right:-10px; font-size:24px; line-height:1;
    display:none; filter:drop-shadow(0 2px 5px rgba(0,0,0,.55)); z-index:2}
  .crown.show{display:block}
  .side .who{font-weight:800; font-size:1.15rem; letter-spacing:.02em}
  .side .role{font-size:.78rem; color:var(--dim); text-transform:uppercase; letter-spacing:.1em}
  .mid{display:grid; place-items:center}
  .mid .vsbadge{
    font-weight:900; font-size:1.35rem; letter-spacing:.02em; color:var(--ink);
    width:52px; height:52px; display:grid; place-items:center; border-radius:50%;
    background:linear-gradient(180deg,#1a2637,#0d1420); border:2px solid var(--line);
    box-shadow:0 0 22px rgba(247,147,26,.15);
  }
  .banner-score{text-align:center; padding:4px 18px 20px; font-size:1.15rem; font-weight:800;
    letter-spacing:-.01em; font-variant-numeric:tabular-nums}
  .banner-score .btcword{color:var(--btc)}
  .banner-score .jword{color:var(--red)}

  /* ---- tabs ---- */
  .tabs{display:flex; gap:6px; margin:20px 0 4px; padding:4px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; overflow-x:auto; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1; min-width:max-content; text-align:center; padding:9px 14px; border-radius:9px;
    color:var(--muted); font-weight:600; font-size:.9rem; cursor:pointer; border:0; background:none;
    transition:color .15s, background .15s}
  .tab.active{background:var(--panel2); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line)}

  .view{display:none; margin-top:18px}
  .view.active{display:block; animation:fade .2s ease}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}

  /* ---- scoreboard ---- */
  .big{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px}
  .card.btc-card{background:linear-gradient(180deg, rgba(247,147,26,.08), var(--panel))}
  .card .k{font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted)}
  .card .v{font-size:1.9rem; font-weight:800; letter-spacing:-.02em; margin:4px 0 2px; font-variant-numeric:tabular-nums}
  .card .d{font-size:.92rem; font-weight:700; font-variant-numeric:tabular-nums}
  .card .gap{font-size:.8rem; color:var(--dim); margin-top:4px}
  .up{color:var(--green)} .down{color:var(--red)}
  .basketline{color:var(--dim); font-size:.78rem; margin-top:10px; line-height:1.7}
  .lead{margin-top:14px; padding:12px 14px; border:1px solid var(--line); border-radius:12px;
    background:var(--panel); color:var(--muted); font-size:.9rem}
  .lead b{color:var(--ink)}

  /* ---- bets (tiles, matching scoreboard) ---- */
  .bet-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .bethead{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .bethead .score2{font-weight:800; font-size:1.05rem}
  .card .dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:1px}
  .dot.open{background:var(--dim)} .dot.won{background:var(--green)} .dot.lost{background:var(--red)}
  .card .bname{font-weight:800; font-size:1.05rem; margin:6px 0 2px; letter-spacing:-.01em}
  .card .bmeta{color:var(--dim); font-size:.78rem}
  .card .bnote{color:var(--muted); font-size:.82rem; margin-top:6px; line-height:1.5}

  /* ---- chart ---- */
  .chartbox{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 8px 6px}
  .legend{display:flex; gap:16px; flex-wrap:wrap; padding:0 8px 6px; font-size:.82rem; color:var(--muted)}
  .legend span{display:inline-flex; align-items:center; gap:6px}
  .swatch{width:14px; height:3px; border-radius:2px; display:inline-block}
  svg.chart{display:block; width:100%; height:auto}

  /* ---- about ---- */
  details{background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden}
  summary{cursor:pointer; padding:13px 16px; font-weight:700; font-size:.92rem; list-style:none; display:flex; justify-content:space-between; align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+"; color:var(--dim); font-weight:700; font-size:1.1rem}
  details[open] summary::after{content:"–"}
  .body{padding:2px 16px 16px; color:var(--muted); font-size:.88rem}
  .body p{margin:8px 0}
  .body b{color:var(--ink)}
  .body .q{border-left:2px solid var(--blue); padding-left:12px; font-style:italic; color:var(--ink)}
  .body .src{color:var(--dim); font-size:.8rem}

  footer{margin-top:30px; padding-top:14px; border-top:1px solid var(--line); color:var(--dim); font-size:.75rem; line-height:1.7}
  footer a{color:var(--muted)}

  @media (max-width:560px){
    .vs{grid-template-columns:1fr 46px 1fr; padding:18px 10px 6px}
    .face{width:58px; height:58px; font-size:34px}
    .face svg{width:44px; height:44px}
    .crown{font-size:20px}
    .mid .vsbadge{width:40px; height:40px; font-size:1.05rem}
    .big{grid-template-columns:1fr 1fr; gap:10px}
    .bet-grid{grid-template-columns:1fr}
    .card .v{font-size:1.55rem}
    .banner-score{font-size:1.05rem}
    .tab{padding:8px 10px; font-size:.82rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="31" fill="#f7931a"/>
        <path fill="#0b0f17" transform="translate(12 12.5) scale(1.77)" d="M23.638 14.904c-1.602 6.43-8.113 10.34-14.542 8.736C2.67 22.05-1.244 15.525.362 9.105 1.962 2.67 8.475-1.243 14.9.358c6.43 1.605 10.342 8.115 8.738 14.548v-.002zm-6.35-4.613c.24-1.59-.974-2.45-2.64-3.03l.54-2.153-1.315-.33-.525 2.107c-.345-.087-.705-.167-1.064-.25l.526-2.127-1.32-.33-.54 2.165c-.285-.067-.565-.132-.84-.2l-1.815-.45-.35 1.407s.975.225.955.236c.535.136.63.486.615.766l-1.477 5.92c-.075.166-.24.406-.614.314.015.02-.96-.24-.96-.24l-.66 1.51 1.71.426.93.242-.54 2.19 1.32.327.54-2.17c.36.1.705.19 1.05.273l-.51 2.154 1.32.33.545-2.19c2.24.427 3.93.257 4.64-1.774.57-1.637-.03-2.58-1.217-3.196.854-.193 1.5-.76 1.68-1.93h.01zm-3.01 4.22c-.404 1.64-3.157.75-4.05.53l.72-2.9c.896.23 3.757.67 3.33 2.37zm.41-4.24c-.37 1.49-2.662.735-3.405.55l.654-2.64c.744.18 3.137.524 2.75 2.084v.006z"/>
      </svg>
      Jason vs Bitcoin
    </div>
    <div class="daychip" id="daychip">…</div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="vs">
      <div class="side jason" id="side-jason">
        <div class="facewrap">
          <div class="face" id="face-jason">🐻</div>
          <span class="crown" id="crown-jason">👑</span>
        </div>
        <div class="who">JASON</div>
        <div class="role">the bear case</div>
      </div>
      <div class="mid"><div class="vsbadge">VS</div></div>
      <div class="side btc" id="side-btc">
        <div class="facewrap">
          <div class="face" id="face-btc"></div>
          <span class="crown" id="crown-btc">👑</span>
        </div>
        <div class="who" style="color:var(--btc)">BITCOIN</div>
        <div class="role">the asset</div>
      </div>
    </div>
    <div class="banner-score" id="score">…</div>
  </section>

  <!-- TABS -->
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab active" data-view="scoreboard">Scoreboard</button>
    <button class="tab" data-view="bets">The bets</button>
    <button class="tab" data-view="chart">Chart</button>
    <button class="tab" data-view="about">Details</button>
  </nav>

  <main>
    <section class="view active" id="view-scoreboard">
      <div class="big" id="cards"></div>
      <div class="lead" id="lead"></div>
    </section>

    <section class="view" id="view-bets">
      <div class="bethead"><span class="score2" id="bets-head"></span></div>
      <div class="bet-grid" id="bets"></div>
    </section>

    <section class="view" id="view-chart">
      <div class="chartbox">
        <div class="legend" id="legend"></div>
        <svg class="chart" id="chart" viewBox="0 0 600 260" preserveAspectRatio="none" role="img" aria-label="Return since the tweet"></svg>
      </div>
    </section>

    <section class="view" id="view-about">
      <details open><summary>The claim</summary><div class="body" id="about-claim"></div></details>
      <details><summary>How it's scored</summary><div class="body" id="about-rules"></div></details>
      <details><summary>Baselines &amp; sources</summary><div class="body" id="about-baselines"></div></details>
      <details id="about-cpi-d"><summary>Real terms (inflation)</summary><div class="body" id="about-cpi"></div></details>
      <div class="body" id="about-notes" style="padding:0 16px"></div>
    </section>
  </main>

  <footer id="footer"></footer>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  function fmtMoney(v, dp){ if(v==null) return "—"; return "$"+Number(v).toLocaleString('en-US',{minimumFractionDigits:dp||0,maximumFractionDigits:dp||0}); }
  function fmtPct(v){ if(v==null) return "—"; return (v>0?"+":"")+Number(v).toFixed(2)+"%"; }
  function fmtSigned(v){ if(v==null) return "—"; return (v>0?"+":"")+Number(v).toFixed(1)+"%"; }
  function cls(v){ return v==null ? "" : (v>=0 ? "up" : "down"); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  var BTC_SVG = '<svg width="54" height="54" viewBox="0 0 64 64" aria-hidden="true">'+
    '<circle cx="32" cy="32" r="31" fill="#f7931a"/>'+
    '<path fill="#0b0f17" transform="translate(12 12.5) scale(1.77)" d="M23.638 14.904c-1.602 6.43-8.113 10.34-14.542 8.736C2.67 22.05-1.244 15.525.362 9.105 1.962 2.67 8.475-1.243 14.9.358c6.43 1.605 10.342 8.115 8.738 14.548v-.002zm-6.35-4.613c.24-1.59-.974-2.45-2.64-3.03l.54-2.153-1.315-.33-.525 2.107c-.345-.087-.705-.167-1.064-.25l.526-2.127-1.32-.33-.54 2.165c-.285-.067-.565-.132-.84-.2l-1.815-.45-.35 1.407s.975.225.955.236c.535.136.63.486.615.766l-1.477 5.92c-.075.166-.24.406-.614.314.015.02-.96-.24-.96-.24l-.66 1.51 1.71.426.93.242-.54 2.19 1.32.327.54-2.17c.36.1.705.19 1.05.273l-.51 2.154 1.32.33.545-2.19c2.24.427 3.93.257 4.64-1.774.57-1.637-.03-2.58-1.217-3.196.854-.193 1.5-.76 1.68-1.93h.01zm-3.01 4.22c-.404 1.64-3.157.75-4.05.53l.72-2.9c.896.23 3.757.67 3.33 2.37zm.41-4.24c-.37 1.49-2.662.735-3.405.55l.654-2.64c.744.18 3.137.524 2.75 2.084v.006z"/>'+
    '</svg>';

  function timeAgo(iso){
    var t = Date.parse(iso);
    if(isNaN(t)) return "recently";
    var days = Math.floor((Date.now()-t)/86400000);
    if(days <= 0) return "today";
    if(days === 1) return "1 day ago";
    return days + " days ago";
  }

  function leader(standing){
    if(standing === "both behind BTC") return "btc";
    if(standing === "both ahead of BTC") return "jason";
    return null;
  }

  function render(d){
    var m = d.meta;
    document.title = "Jason vs Bitcoin — day " + m.day_of;
    $("daychip").textContent = "Day " + m.day_of + " of " + m.total_days;
    $("face-btc").innerHTML = BTC_SVG;

    // integrated score (no "open" count)
    var c = d.bets.counts || {won:0,lost:0};
    $("score").innerHTML =
      '<span class="jword">Jason '+c.won+'</span> — <span class="btcword">'+c.lost+' Bitcoin</span>';

    // leading indicator (crown + ring), no text
    var lead = leader(d.standing);
    if(lead === "btc"){
      $("crown-btc").classList.add("show");
      $("crown-btc").setAttribute("title", "Bitcoin is ahead");
      $("face-btc").classList.add("lead-btc");
    } else if(lead === "jason"){
      $("crown-jason").classList.add("show");
      $("crown-jason").setAttribute("title", "Jason is ahead");
      $("face-jason").classList.add("lead-jason");
    }

    // scoreboard tiles
    var sb = d.scoreboard;
    $("cards").innerHTML =
      card("Bitcoin", sb.btc.price, sb.btc.ret_pct, null, true) +
      card("QQQ", sb.qqq.price, sb.qqq.ret_pct, sb.qqq.behind_btc_pct, false) +
      card("Top AI · "+sb.ai.basket.length+" names", null, sb.ai.ret_pct, sb.ai.behind_btc_pct, false, sb.ai) +
      card("MAGS", sb.mags.price, sb.mags.ret_pct, sb.mags.behind_btc_pct, false);

    $("lead").innerHTML =
      "<b>The call:</b> Jason needs <b>both</b> QQQ <i>and</i> the AI basket to beat BTC at the 12/24/36-month marks. " +
      "Nothing settles until 2027–2029 — this is the live read, not a verdict.";

    // bets as tiles
    $("bets-head").textContent = d.bets.headline || "";
    $("bets").innerHTML = (d.bets.rows||[]).map(betCard).join("");

    drawChart(d.chart);

    $("about-claim").innerHTML =
      '<p class="q">“90% chance that $QQQ and top AI companies will beat $BTC over the next 12, 24 and 36 months” and “Bitcoin won’t break its record high in next 12 months.”</p>'+
      '<p>Then doubled down: <span class="q">“We will test the 57k low again in the next 12 months”</span> and <span class="q">“Bitcoin will never break its all-time high again.”</span></p>'+
      '<p class="src"><a href="'+esc(m.tweet_url)+'" target="_blank" rel="noopener">original tweet</a> · <a href="'+esc(m.tweet2_url)+'" target="_blank" rel="noopener">second tweet</a> · track record: <a href="'+esc(m.ref_url)+'" target="_blank" rel="noopener">“11 years, still waiting for zero”</a></p>';
    $("about-rules").innerHTML =
      '<p><b>Six bets, one score.</b> The 12/24/36-month calls are each ONE bet that <b>both</b> QQQ <i>and</i> the AI basket beat BTC — if only one does, Jason loses that bet. “No new record high” can only be <b>lost early</b> (a break); “test $57k” can only be <b>won early</b> (a print at/below $57,000); “never break ATH again” has no expiry.</p>'+
      '<p><b>Equity legs are total return</b> — dividends reinvested at their ex-date close (BTC pays none). Verdicts stay nominal; the inflation note is context, never a scoreboard change.</p>'+
      '<p>“Top AI companies” is read as an equal-weight basket of 9: NVDA, MSFT, GOOGL, AMZN, META, AVGO, AMD, TSM, SPCX. SPCX is itself a Nasdaq-100 member, so QQQ already holds it.</p>';
    $("about-baselines").innerHTML =
      '<p>Baselines frozen at the <b>'+esc(m.claim_posted)+'</b> close: QQQ <b>'+fmtMoney(m.baselines.QQQ,2)+'</b>, BTC <b>'+fmtMoney(m.baselines.BTC,0)+'</b>. Record high <b>'+fmtMoney(m.baselines.record_high,0)+'</b> (set '+esc(m.baselines.ath_date)+').</p>'+
      '<p class="src">Sources: Nasdaq (historical + real-time), CoinGecko (BTC), BLS/FRED (CPI).</p>';
    if(d.cpi){
      $("about-cpi-d").style.display = "block";
      $("about-cpi").innerHTML =
        '<p>US CPI is running <b>'+fmtPct(d.cpi.yoy_pct)+'/yr</b> (+'+fmtPct(d.cpi.cum_pct)+' cumulative since the claim). A flat nominal return is a real decline by that much. Source: '+esc(d.cpi.source||"")+' · '+esc(d.cpi.latest_month||"")+'</p>';
    } else { $("about-cpi-d").style.display = "none"; }
    var notes = d.notes || [];
    $("about-notes").innerHTML = notes.length ? '<p style="color:var(--dim);font-size:.8rem">⚠️ '+esc(notes.join(" · "))+'</p>' : '';

    $("footer").innerHTML =
      esc(d.disclaimer)+" · Updated "+timeAgo(m.generated_at)+" · "+
      '<a href="'+esc(m.tweet_url)+'" target="_blank" rel="noopener">source</a>';
  }

  function card(name, price, ret, gap, isBtc, ai){
    var extra = "";
    if(ai){
      var parts = ai.parts || {};
      var detail = ai.basket.map(function(t){ return t+" "+fmtSigned(parts[t]); });
      extra = '<div class="basketline">'+esc(detail.join(" · "))+'</div>';
    }
    return '<div class="card'+(isBtc?' btc-card':'')+'">'+
      '<div class="k">'+esc(name)+'</div>'+
      '<div class="v">'+(price!=null?fmtMoney(price, price>=1000?0:2):"—")+'</div>'+
      '<div class="d '+cls(ret)+'">'+fmtPct(ret)+'</div>'+
      (gap!=null?'<div class="gap">'+fmtSigned(gap)+' vs BTC</div>':'')+
      extra+'</div>';
  }

  function betCard(b){
    var st = b.status || "open";
    return '<div class="card">'+
      '<div class="k"><span class="dot '+esc(st)+'"></span>'+esc(st.toUpperCase())+'</div>'+
      '<div class="bname">'+esc(b.name)+'</div>'+
      '<div class="bmeta">resolves '+esc(b.resolves)+'</div>'+
      '<div class="bnote">'+esc(b.note)+'</div>'+
      '</div>';
  }

  function drawChart(c){
    var svg = $("chart");
    var W = 600, H = 260, padL = 38, padR = 10, padT = 12, padB = 24;
    var dates = c.dates || [];
    var series = {BTC:c.btc, QQQ:c.qqq, AI:c.ai};
    var colors = {BTC:"#f7931a", QQQ:"#5ea8ff", AI:"#2ee6a8"};
    $("legend").innerHTML = Object.keys(series).map(function(k){
      return '<span><span class="swatch" style="background:'+colors[k]+'"></span>'+k+'</span>';
    }).join("");
    if(!dates.length){ svg.innerHTML = ""; return; }
    var all = [];
    Object.keys(series).forEach(function(k){ (series[k]||[]).forEach(function(v){ if(v!=null) all.push(v); }); });
    if(!all.length){ svg.innerHTML = ""; return; }
    var lo = Math.min(0, Math.min.apply(null, all));
    var hi = Math.max(0, Math.max.apply(null, all));
    if(hi-lo < 1){ hi = lo+1; }
    var x = function(i){ return padL + (dates.length<=1 ? 0 : i/(dates.length-1)*(W-padL-padR)); };
    var y = function(v){ return padT + (1-(v-lo)/(hi-lo))*(H-padT-padB); };

    var parts = [];
    var zeroY = y(0);
    parts.push('<line x1="'+padL+'" y1="'+zeroY+'" x2="'+(W-padR)+'" y2="'+zeroY+'" stroke="#2a3950" stroke-width="1"/>');
    [lo, 0, hi].forEach(function(v){
      if(v==null) return;
      parts.push('<text x="'+(padL-6)+'" y="'+(y(v)+3)+'" text-anchor="end" font-size="10" fill="#7c8799">'+ (v>=0?"+":"") + v.toFixed(1)+'%</text>');
    });
    Object.keys(series).forEach(function(k){
      var pts = [];
      (series[k]||[]).forEach(function(v,i){ if(v!=null) pts.push(x(i)+","+y(v)); });
      if(pts.length < 2) return;
      parts.push('<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+colors[k]+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>');
    });
    Object.keys(series).forEach(function(k){
      var arr = series[k]||[]; var last=null, li=-1;
      for(var i=arr.length-1;i>=0;i--){ if(arr[i]!=null){ last=arr[i]; li=i; break; } }
      if(last!=null) parts.push('<circle cx="'+x(li)+'" cy="'+y(last)+'" r="3.5" fill="'+colors[k]+'"/>');
    });
    if(dates.length){
      parts.push('<text x="'+padL+'" y="'+(H-8)+'" text-anchor="start" font-size="10" fill="#7c8799">'+esc(dates[0])+'</text>');
      parts.push('<text x="'+(W-padR)+'" y="'+(H-8)+'" text-anchor="end" font-size="10" fill="#7c8799">'+esc(dates[dates.length-1])+'</text>');
    }
    svg.innerHTML = parts.join("");
  }

  $("tabs").addEventListener("click", function(e){
    var btn = e.target.closest(".tab"); if(!btn) return;
    document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
    btn.classList.add("active");
    $("view-"+btn.dataset.view).classList.add("active");
  });

  fetch('data.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(render)
    .catch(function(e){ $("daychip").textContent = "could not load data ("+esc(e.message)+")"; });
})();
</script>
</body>
</html>
